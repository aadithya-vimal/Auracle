[package]
name = "auracle"
version = "0.1.0"
description = "Sentiment Oracle for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "auracle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"

[dev-dependencies]
solana-program-test = "1.16"
solana-sdk = "1.16"
